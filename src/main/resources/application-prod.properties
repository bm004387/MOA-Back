spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=ysc

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-actual-param-name=true

# 커뮤니티 동영상과 첨부 파일 업로드를 허용합니다(파일별 최대 100MB, 최대 5개).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=520MB

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# 서비스 계정 JSON 파일 경로는 GOOGLE_APPLICATION_CREDENTIALS 환경변수로 전달합니다.
app.push.enabled=${APP_PUSH_ENABLED:false}

solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.sender=${SOLAPI_SENDER}
