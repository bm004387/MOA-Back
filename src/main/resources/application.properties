spring.application.name=ysc
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc\:postgresql://localhost:15432/ysc
spring.datasource.username=ysc
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=ysc

mybatis.mapper-locations=classpath\:mapper/\*\*/\*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-actual-param-name=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# FCM 전송은 Firebase 서비스 계정 자격 증명을 설정한 경우에만 활성화합니다.
app.push.enabled=${APP_PUSH_ENABLED:false}

# 로그인 세션은 유휴 시간과 최대 유지 시간을 함께 적용합니다.
app.security.session-idle-ttl=${AUTH_SESSION_IDLE_TTL:30m}
app.security.session-absolute-ttl=${AUTH_SESSION_ABSOLUTE_TTL:12h}
app.security.login.max-failures-per-account-ip=${AUTH_LOGIN_MAX_FAILURES_PER_ACCOUNT_IP:10}
app.security.login.max-failures-per-account=${AUTH_LOGIN_MAX_FAILURES_PER_ACCOUNT:30}
app.security.login.failure-window=${AUTH_LOGIN_FAILURE_WINDOW:15m}
app.security.pin.max-failures-per-account-ip=${AUTH_PIN_MAX_FAILURES_PER_ACCOUNT_IP:5}
app.security.pin.max-failures-per-account=${AUTH_PIN_MAX_FAILURES_PER_ACCOUNT:5}
app.security.pin.failure-window=${AUTH_PIN_FAILURE_WINDOW:15m}
app.security.deploy-token=${DEPLOY_API_TOKEN:}

solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.sender=${SOLAPI_SENDER}

# Docker에서 FILE_STORAGE_ROOT를 영속 볼륨 경로로 설정하세요.
file.storage.root=${FILE_STORAGE_ROOT:./uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=520MB
